<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WideDrop Test</title>
    <link rel="stylesheet" href="src/overlay.css">
    <style>
      body {
        margin: 0;
        background: #f8fafc;
        color: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .log {
        padding: 24px;
      }

      .compose {
        margin: 16px;
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
      }

      [role="textbox"] {
        min-height: 56px;
        padding: 12px;
        border: 1px solid #9ca3af;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="log">
        <h1>Drop a file anywhere</h1>
        <p id="status">Waiting...</p>
      </section>
      <section class="compose" aria-label="message composer">
        <div role="textbox" contenteditable="true" aria-label="Message">Test compose box</div>
      </section>
    </main>
    <script src="src/content.js"></script>
    <script>
      document.querySelector('[role="textbox"]').addEventListener('drop', (event) => {
        event.preventDefault();
        const files = Array.from(event.dataTransfer.files).map((file) => file.name);
        document.getElementById('status').textContent =
          files.length ? `Received: ${files.join(', ')}` : 'Drop reached textbox without files';
      });
    </script>
  </body>
</html>
